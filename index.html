<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Experimento con JavaScript</title>
</head>
<body>

    <h1>Práctica de Botones</h1>
    <p>Haz clic en el botón para ver qué pasa:</p>

    <!-- Creamos un botón que ejecuta una función al darle clic -->
    <button onclick="cambiarTexto()">Haz clic aquí</button>

    <h2 id="mensaje">Este texto va a cambiar...</h2>

    <script>
        // Esta función cambia el texto de la pantalla cuando presionas el botón
        function cambiarTexto() {
            document.getElementById("mensaje").innerText = "¡El texto cambió usando JavaScript!";
        }
    </script>

</body>
</html>
